# The large-corpora NPI-SAM loop (benchmark/run_config_large.yaml, pisam_milp block)
# with the MILP's per-schema non-empty constraint on: every operator must have at
# least one precondition and one add effect. The other two constraint families of
# the ROSAME+MILP encoding stay off. gt_anchoring is overridden by the driver
# (init_only by backfill_anchored_solve_cap, none by backfill_nogt_s0); the 60 s
# solve cap comes from --solve-time-limit.
pisam_milp:
  eq16: off
  lambda_pre: 0.4
  gt_anchoring: init_only
  schema_nonempty: pre_and_add
  solver: cpsat
  time_limit_seconds:
  sampler: random
  subset_size: 4
  learner_input: subset_only
  pool_policy: frozen
  co_sample_conflicts: off
  w_prior: tiebreak
  seed: 42
  stop:
    budget_seconds:
    no_improvement_rounds: auto
    stop_on_perfect_fit: true
    max_rounds:
    stop_on_fixpoint: true
  eval:
    effect_mismatch_weight: 1.0
    inapplicability_weight: 1.0

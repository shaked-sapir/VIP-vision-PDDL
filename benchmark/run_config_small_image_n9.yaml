# Small image experiment on the held-out-example corpora (`__fs=shared`), the
# two domains whose corpus holds 9 problems: one of the 10 shipped problems is
# the held-out example. A fold trains on 7 of the 9, so the sweep ends at 7.
# Everything else equals run_config_small_image.yaml
# (benchmark/test_image_run_configs.py checks it).
#
# Run with:
#   python -m benchmark.benchmark_runner --config benchmark/run_config_small_image_n9.yaml --dry-run
#
# On the cluster: scripts/cluster_image/README.md, "Image experiments on the
# cluster". Results land in benchmark/running_results/<domain>/<run_name>/.

run_name: TO=600__image-small__fs=shared   # an image cell's experiment name is the run_name
source: image

shared:
  n_folds: 5
  cv_scheme: montecarlo                 # an independent 80/20 split per fold: 7 train / 2 test of 9
  num_trajectories: [3, 4, 5, 6, 7]
  gt_rates: [0]
  learning_timeout_seconds: 600
  planning_timeout_seconds: 60
  search_mode: dfs
  node_choosing_strategy: model_patch_first
  model_constraint_weight: 0.0
  conflict_group_strategy: largest
  fluent_branch_mode: single
  events_tracing: false
  normalize: false                      # cells read training/image_trajectories/ as it is
  resume: true
  # Symbolic ROSAME arms: the small-data settings of run_config.yaml.
  batch_size: 0                         # one optimizer step per trace
  normalize_base_loss: false
  rosame_seed: 8800
  algorithms: [pisam_milp_loop, pisam, rosame_24, rosame_milp_24]
  baseline_regime_gate: strict

  # benchmark/milp_configs/npisam_schema_nonempty_small.yaml with one solve
  # capped at 60 s. The row is PISAM_MILP_LOOP__schema=pre_and_add.
  pisam_milp:
    eq16: off
    lambda_pre: 0.4
    gt_anchoring: init_only
    schema_nonempty: pre_and_add
    solver: cpsat
    time_limit_seconds: 60              # cap for ONE solve
    sampler: random
    subset_size: half
    learner_input: subset_only
    pool_policy: frozen
    co_sample_conflicts: off
    w_prior: tiebreak
    seed: 42
    stop:
      budget_seconds:                   # blank = inherit learning_timeout_seconds
      no_improvement_rounds:            # blank = off
      stop_on_perfect_fit: true
      max_rounds:
      stop_on_fixpoint: true
    eval:
      effect_mismatch_weight: 1.0
      inapplicability_weight: 1.0

domains:
  - {domain_key: depot,   data_dir: "benchmark/data/depot/multi_problem_04-07-2026T01:32:08__model=gpt-5.2__steps=100__fs=shared"}
  - {domain_key: gripper, data_dir: "benchmark/data/gripper/multi_problem_04-07-2026T14:50:04__model=gpt-5.2__steps=100__fs=shared"}

# The single editable run config. Edit this file in place with your desired
# run_name + params, then run the batch — no need to create a new file per run.
#
# Run with:
#   python -m benchmark.benchmark_runner                 # uses this file by default
#   python -m benchmark.benchmark_runner --dry-run       # preview cells, no execution
#   python -m benchmark.benchmark_runner --config other.yaml   # override the default
#
# A timestamped manifest (params + per-domain output paths) is archived to:
#   benchmark/finished_run_configs/<run_name>/<timestamp>.json

run_name: simulation-final-run            # names the output experiments + the manifest dir
source: simulated                       # image | simulated

# Shared benchmark params — forwarded to experiment_runner.main().
# Any omitted key falls back to main()'s own default.
shared:
  n_folds: 5                            # any int >= 1
  num_trajectories: [3, 4, 5, 6, 7, 8]  # list of ints (trajectory counts to evaluate)
  gt_rates: [0]                         # list of ints — GT injection rates in % (e.g. 0, 25, 50)
  learning_timeout_seconds: 300         # any int (seconds)
  planning_timeout_seconds: 60          # any int (seconds)
  search_mode: dfs                      # dfs | ucs
  node_choosing_strategy: model_patch_first  # model_patch_first | fluent_patch_first | fluent_patch_first_then_model | randomized
  model_constraint_weight: 0.0          # any float >= 0
  conflict_group_strategy: largest      # first | largest | largest_model_patchable | most_observations | smallest
  fluent_branch_mode: single            # group | single
  events_tracing: false                  # true | false -> make this true only when debugging, this produces an html showing the whole search space and it is HEAVY
  resume: false                         # true | false -> skip fold instances already completed (fold_result.json present); strict-aborts if config differs from the saved run_params.json
  algorithms: [cdps]            # any subset of: cdps (ours), cdps_anchored, cdps_milp_single_round, cdps_milp_loop, rosame, rosame_i, rosame_milp*. e.g. [cdps] or [rosame] to run one standalone

  # Shared by both MILP arms; each arm pins its own variant from the selected
  # algorithm key, so listing both runs both off this one block. Only read when
  # a MILP arm is selected, but always validated (a typo here fails the run
  # immediately, not three hours in).
  cdps_milp:
    eq16: off                           # on | off — precondition bias (lambda_pre). NOTE: changes T' itself, so it voids the cost(MILP) <= cost(CDPS) sanity check
    lambda_pre: 0.4                     # any float; used only when eq16: on
    gt_anchoring: init_only             # init_only | all_gt_states — which known-GT states are hard-fixed (unrepairable)
    solver: cpsat                       # cpsat (gurobi is declared but unimplemented — needs a license)
    time_limit_seconds:                 # cap for ONE solve. blank = inherit learning_timeout_seconds, which is what makes the head-to-head with CDPS fair

    # ---- loop-only (ignored by cdps_milp_single_round) ------------------
    sampler: random                     # random | hardest_first — how each round picks its subset
    subset_size: half                   # half (= max(2, ceil(n/2))) | all | <int>
    learner_input: subset_only          # subset_only | accumulated — what PI-SAM sees each round. `accumulated` feeds it every trace repaired so far, which no single solve ever certified jointly, so it can conflict
    pool_policy: frozen                 # frozen | replace | frozen_with_hints. `replace` feeds repaired traces back into the pool, which voids dedup and the fixpoint stop rule
    co_sample_conflicts: off            # on | off — after an accumulated mixed-set conflict, co-sample the conflicting traces next round
    w_prior: tiebreak                   # tiebreak | off | <float> — weight of the reference-model channel
    seed: 42                            # any int — drives the sampler (the solver's own seed is pinned in code)
    stop:
      budget_seconds:                   # cap for the WHOLE loop. blank = inherit learning_timeout_seconds
      no_improvement_rounds:            # blank = off — stop after N rounds with no strict improvement in V
      stop_on_perfect_fit: true         # true | false — stop as soon as V(M_best) == 0
      max_rounds:                       # blank = unlimited
      stop_on_fixpoint: true            # true | false — stop when every admissible (subset, M_best) pair has been solved
    eval:
      effect_mismatch_weight: 1.0       # any float >= 0 — V's w1
      inapplicability_weight: 1.0       # any float >= 0 — V's w2

# Mode-specific block (only read when source: simulated).
simulation:
  masking_strategy: percentage          # percentage | random
  noising_strategy: percentage          # percentage | random
  seed: 42                              # any int (RNG seed)
  grid:
    masking_ps: [0.0, 0.01, 0.1]
    noising_ps: [0.0, 0.1, 0.2]             # list of floats in [0, 1]

# Per-domain: only domain_key + data_dir. data_dir must contain
# training/trajectories/ (for imaged version) and gt_trajectories/ (for simulated version).

domains:
  - {domain_key: blocksworld, data_dir: "benchmark/data/blocksworld/blocks_predefined_problems1-10_final-version"}
  - {domain_key: hanoi,       data_dir: "benchmark/data/hanoi/hanoi_generated_problem1__final-version_fixed"}
  - {domain_key: npuzzle,     data_dir: "benchmark/data/npuzzle/npuzzle_generated_problem0__final-version_fixed"}
  - {domain_key: depot,       data_dir: "benchmark/data/depot/multi_problem_04-07-2026T01:32:08__model=gpt-5.2__steps=100"}
  - {domain_key: gripper,     data_dir: "benchmark/data/gripper/multi_problem_04-07-2026T14:50:04__model=gpt-5.2__steps=100"}

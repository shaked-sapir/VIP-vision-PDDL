# Configuration for the results-dashboard generators
# (benchmark/evaluation/cfm/build_sim_dashboard.py and build_image_dashboard.py).
#
# All paths are relative to the project root. Edit the values below and re-run
# the generators; nothing here is auto-discovered except the grid cells found
# under each simulation prefix.

results_dashboard:

  # Root folder holding one subfolder per domain of experiment results.
  results_root: benchmark/running_results

  # Single output page (simulation + image live in one HTML, behind a toggle).
  output_html: benchmark/running_results/results_dashboard.html

  # Domains to include, in display order (used by both dashboards).
  domains:
    - blocksworld
    - depot
    - gripper
    - hanoi
    - npuzzle

  # Error band drawn around the mean in the trend plots (for embedded mode):
  #   std    — mean ± std across folds (historical default)
  #   ci95   — t-based 95% confidence interval on the mean
  #   minmax — min/max envelope across folds
  # Applies when plots are (re)generated, i.e. with --regen-plots.
  error_band: std

  # Metrics to show (key must match the "<key>_trend.png" plot names;
  # label is what appears in the metric nav / table headers).
  metrics:
    - key: pred_app_precision
      label: "Predictive applicability precision"
    - key: pred_app_recall
      label: "Predictive applicability recall"
    - key: pred_eff_precision
      label: "Predicted effects precision"
    - key: pred_eff_recall
      label: "Predicted effects recall"
    - key: solving_ratio
      label: "Problem solving ratio"
    - key: false_plans_ratio
      label: "False Plans ratio"
    - key: unsolvable_ratio
      label: "Unsolvable ratio"
    - key: fluent_patch_count
      label: "Fluent patch count"

  # Baseline / competitor registry. Declares which experiment modes each series
  # belongs to, so a mode-only algorithm never shows in the wrong tab. The key
  # must match the "algorithm" field in fold_result.json. Our own series (CDPS,
  # its oracle) always appear in both modes and need no entry here. Any baseline
  # NOT listed defaults to whichever mode it has data in.
  algorithms:
    - key: ROSAME       # simulation baseline (degraded PDDL trajectories)
      modes: [simulation]
    - key: ROSAME-I     # image baseline (learned straight from visual traces)
      modes: [image]

  # Baselines present in fold_result.json but omitted from learning-curve plots,
  # legend, and Δ tables. Keys must match the "algorithm" field exactly.
  exclude_algorithms:
    - ROSAME_MILP_BASE

  # ── Simulation section (mask x noise grid-search per domain) ──
  simulation:
    # Per-domain experiment-name prefix of the grid-search runs. The generator
    # globs "<results_root>/<domain>/<prefix>*mask=*noise=*" for the 9 cells.
    prefix:
      blocksworld: sim_run
      depot: simulation-after-pred-fix 
      gripper: sim_run
      hanoi: simulation-checkup-after-gtfixed
      npuzzle: simulation-checkup-after-gtfixed

  # ── Image section (single experiment per domain) ──
  image:
    # Per-domain path to the single image-experiment result directory
    # (each contains testing/ and evaluation_results/).
    experiment_dir:
      blocksworld: benchmark/running_results/blocksworld/TO=600__blocks_predefined_problems1-10_final-version
      depot: benchmark/running_results/depot/TO=600__depot_data_from_PV__groundfix
      gripper: benchmark/running_results/gripper/TO=600__gripper_data_from_PV
      hanoi: benchmark/running_results/hanoi/TO=600__hanoi_generated_problem1__final-version
      npuzzle: benchmark/running_results/npuzzle/TO=600__npuzzle_prob0_6-10steps_generate  
